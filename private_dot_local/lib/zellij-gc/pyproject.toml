[project]
name = "zellij-gc"
version = "0.1.0"
description = "Garbage-collect zellij sessions abandoned at the welcome screen."
requires-python = ">=3.11"
# No runtime dependencies: stdlib only; all session queries shell out to the zellij CLI.
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",    # no shadowing of builtins
  "B",    # likely bugs
  "C4",   # comprehensions
  "D",    # docstrings
  "DTZ",  # timezone-aware datetimes
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "FURB", # modern idioms
  "I",    # import order
  "N",    # naming
  "PERF", # performance
  "PL",   # pylint
  "PTH",  # pathlib over os.path
  "RUF",  # ruff's own
  "SIM",  # simplifications
  "UP",   # newer syntax
  "W",    # pycodestyle warnings
]
ignore = [
  "D203",    # conflicts with D211 (no blank line before a class docstring)
  "D213",    # conflicts with D212 (summary on the first docstring line)
  "D401",    # some docstrings name what is returned, which reads better than a forced imperative
]

[tool.ruff.lint.per-file-ignores]
# Test names say what they check; fixtures and helpers don't each need a docstring (D).
# The numbers in assertions are clearer written out than as named constants (PLR2004).
"tests/*" = ["D", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["zellij_gc"]

[tool.pytest.ini_options]
# Run pytest from this directory; the package imports as `zellij_gc`.
pythonpath = ["."]
testpaths = ["tests"]
