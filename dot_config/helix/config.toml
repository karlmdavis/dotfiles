# Draw with the terminal's 16 ANSI colours so Helix inherits the iTerm2 palette (Tokyo Night Storm in
# dark mode) and follows light/dark mode, the same way Claude Code's `theme: "dark-ansi"` does.
# See `private_Library/private_Application Support/iTerm2/README.md` in the dotfiles repo.
theme = "base16_terminal"

# Visually wraps all lines too long to fit the current editor without horizontal scrolling.
[editor.soft-wrap]
enable = true

# Option/Alt+Left/Right move by word while typing, matching the shells. Insert mode only, where
# these keys are otherwise unbound: normal and select mode keep Helix's defaults.
# `move_next_word_end` stops on a word's last letter, so A-right steps one further to land just
# past the word, where the shells put the cursor.
[keys.insert]
A-left = ["move_prev_word_start", "collapse_selection"]
A-right = ["move_next_word_end", "collapse_selection", "move_char_right"]
