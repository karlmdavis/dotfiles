# Aerospace workspace configuration (machine-specific, not overwritten by chezmoi).
# See: ~/.local/share/chezmoi/dot_aerospace.toml.tmpl
#
# 'workspaces' maps single-character workspace IDs to a record of optional display fields:
#   icon  - an emoji shown as the workspace's icon in the SwiftBar menu bar and the
#           workspace-switch HUD (plain Unicode text, so both can render it).
#   name  - a short human-readable name shown alongside the ID.
#   hint  - extra context for IDs whose name isn't obvious; SwiftBar shows it as a hover
#           tooltip and the HUD shows it as a dimmer second line.
# All three fields are optional; a workspace with no 'name' falls back to the bare ID.
#
# 'window-rules' auto-assigns applications to workspaces when windows open. Each
# rule needs 'app-id' and 'workspace'; 'title-regex' is optional for apps with
# multiple window types. Rules are evaluated in order — first match wins.
# This 'title-regex' is AeroSpace's own matcher (window-title-regex-substring), unlike
# the Python regex used by 'sticky-windows' below.
#
# 'sticky-windows' keeps matching windows visible on every workspace (AeroSpace has no
# native option for this): on each workspace switch they're made floating and moved to the
# newly focused workspace. With several monitors they follow your focus across them too,
# leaving the other monitors' workspaces.
# Each rule needs 'app-id'. 'title-regex' (a Python regex) is optional and narrows the rule
# to e.g. one popup rather than all of the app's windows: omit it (or leave it null) to
# match every window; '' matches only untitled windows.
# The hook is only wired into ~/.aerospace.toml when this list is non-empty, so after adding
# the first rule run `chezmoi apply`; later edits take effect on the next workspace switch.
# A rule with an invalid 'title-regex' is skipped; run
# `~/.config/aerospace/follow-sticky-windows.py --dry-run` to see the warning.
#
# Find an app's bundle ID with:
#   mdls -name kMDItemCFBundleIdentifier /Applications/AppName.app
#
# Example:
# workspaces:
#   N:
#     icon: 📝
#     name: Notes
#   C:
#     icon: 💬
#     name: Comms
#   V:
#     icon: 📹
#     name: Meetings
#     hint: 'the "v" is for "video calls"'
#
# window-rules:
#   - app-id: com.tinyspeck.slackmacgap
#     workspace: C
#   - app-id: com.microsoft.Outlook
#     title-regex: '[Cc]alendar'
#     workspace: S
#   - app-id: com.microsoft.Outlook
#     workspace: C
#
# sticky-windows:
#   - app-id: com.example.Calendar
#     title-regex: '^[0-9]+ Reminders?$'
